    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f6f4a" />

      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6f4a'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='system-ui,sans-serif'%3E%24%3C/text%3E%3C/svg%3E"
    />
